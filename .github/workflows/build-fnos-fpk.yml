name: Build fnOS FPK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install official fnpack 1.2.3
        run: |
          curl -fL --retry 3 https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64 -o /tmp/fnpack
          chmod +x /tmp/fnpack
          sudo mv /tmp/fnpack /usr/local/bin/fnpack
          fnpack --help >/dev/null

      - name: Download official Go dependencies
        run: |
          go mod download
          grep 'github.com/showwin/speedtest-go v1.8.3' go.sum

      - name: Test
        run: |
          go test ./...
          go vet ./...
          node web_ui_test.cjs

      - name: Build fnOS x86_64 package
        run: bash build.sh

      - name: Inspect package
        run: |
          file dist/fnos-speedtest-1.10.15-x86_64.fpk
          sha256sum dist/fnos-speedtest-1.10.15-x86_64.fpk
          tar -tzf dist/fnos-speedtest-1.10.15-x86_64.fpk | sort
          rm -rf /tmp/fnos-speedtest-inspect && mkdir -p /tmp/fnos-speedtest-inspect
          tar -xzf dist/fnos-speedtest-1.10.15-x86_64.fpk -C /tmp/fnos-speedtest-inspect
          tar -xzf /tmp/fnos-speedtest-inspect/app.tgz -C /tmp/fnos-speedtest-inspect
          test -x /tmp/fnos-speedtest-inspect/bin/speedtest-go
          /tmp/fnos-speedtest-inspect/bin/speedtest-go --version

      - name: Upload FPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnos-speedtest-1.10.15-x86_64
          path: |
            dist/fnos-speedtest-1.10.15-x86_64.fpk
            dist/fnos-speedtest-1.10.15-x86_64.fpk.sha256
          if-no-files-found: error
