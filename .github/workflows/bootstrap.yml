name: Bootstrap fnOS Speedtest source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and extract source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part_*.b64 | base64 -d > /tmp/fnos-speedtest-source.tar.xz
          mkdir -p /tmp/src
          tar -xJf /tmp/fnos-speedtest-source.tar.xz -C /tmp/src
          cp -a /tmp/src/fnos-speedtest/. .

      - name: Rebuild generated PNG icons
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p package/app/ui/images dist
          convert -size 512x512 xc:none \
            -fill '#0b1727' -stroke none -draw 'roundrectangle 24,24 488,488 116,116' \
            -fill none -stroke '#233b58' -strokewidth 32 -draw 'arc 111,202 401,492 180,360' \
            -stroke '#42d6ff' -strokewidth 32 -draw 'arc 111,202 401,492 180,315' \
            -stroke '#aeefff' -strokewidth 22 -draw 'line 256,108 256,155 line 119,165 153,199 line 393,165 359,199' \
            -stroke '#48e0aa' -strokewidth 28 -draw 'line 334,243 269,321' \
            -fill '#5688ff' -stroke none -draw 'circle 256,337 294,337' \
            -fill '#07111f' -draw 'circle 256,337 269,337' /tmp/icon-512.png
          convert /tmp/icon-512.png -resize 64x64 package/ICON.PNG
          convert /tmp/icon-512.png -resize 256x256 package/ICON_256.PNG
          cp package/ICON.PNG package/app/ui/images/icon_64.png
          cp package/ICON_256.PNG package/app/ui/images/icon_256.png
          chmod +x build.sh package/cmd/*

      - name: Commit complete source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import fnOS Speedtest v1.10.3 source"
          git push origin HEAD:main
